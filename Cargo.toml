[package]
name = "deepseek-mcp"
version = "0.1.0"
edition = "2021"
description = "A tiny local MCP server exposing DeepSeek Search / Fetch API to any MCP client"
license = "MIT"

[[bin]]
name = "deepseek-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

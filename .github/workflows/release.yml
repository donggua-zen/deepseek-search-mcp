name: Release

# Builds prebuilt binaries for the platforms we can't cross-compile locally.
# Trigger manually (Actions -> Release -> Run workflow), or by pushing a v* tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach binaries to (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Pin the min macOS version: building on a macos-15 runner would otherwise
  # stamp LC_VERSION_MIN_MACOSX=15.0 and refuse to run on anything older.
  # 11.0 is the floor for Apple Silicon anyway, so one target covers both.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 (Apple Silicon)
            os: macos-15-arm64
            target: aarch64-apple-darwin
            asset: deepseek-search-mcp-macos-arm64
          - name: macOS x64 (Intel)
            os: macos-15
            target: x86_64-apple-darwin
            asset: deepseek-search-mcp-macos-x64
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: deepseek-search-mcp-linux-x64
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: deepseek-search-mcp-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -eu
          BIN=target/${{ matrix.target }}/release/deepseek-mcp
          OUT=${{ matrix.asset }}
          cp "$BIN" "$OUT"
          chmod +x "$OUT"
          # Ad-hoc signature so the binary survives Gatekeeper on Apple Silicon.
          # Not notarised (no paid Apple Developer account), so users still need
          # to clear the quarantine xattr after downloading — see README.
          if [ "${{ runner.os }}" = "macOS" ]; then
            codesign --force --sign - "$OUT"
            codesign --verify --verbose=2 "$OUT" || exit 1
          fi
          shasum -a 256 "$OUT" > "$OUT.sha256"
          file "$BIN"
          ls -lh "$OUT"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          BIN=target/${{ matrix.target }}/release/deepseek-mcp.exe
          OUT=${{ matrix.asset }}
          cp "$BIN" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          ls -lh "$OUT"

      - name: Verify binary runs
        shell: bash
        run: |
          set -eu
          ./${{ matrix.asset }} --version

      - name: Verify architecture
        shell: bash
        run: |
          set -eu
          # Fail loudly if the runner produced the wrong slice; a mislabelled
          # binary is worse than no binary.
          case "${{ matrix.asset }}" in
            *macos-arm64)   WANT="arm64";;
            *macos-x64)     WANT="x86_64";;
            *linux-x64)     WANT="x86-64";;
            *)              WANT="";;
          esac
          if [ -n "$WANT" ]; then
            INFO=$(file "${{ matrix.asset }}")
            echo "$INFO"
            echo "$INFO" | grep -q "$WANT" || { echo "::error::expected $WANT"; exit 1; }
          fi

      - name: Verify macOS deployment target
        if: runner.os == 'macOS'
        run: |
          set -eu
          otool -l "${{ matrix.asset }}" | grep -A4 LC_BUILD_VERSION | head -10
          v=$(otool -l "${{ matrix.asset }}" | grep -m1 minos | awk '{print $2}')
          echo "minos=$v"
          # Must not require a newer macOS than the pinned deployment target.
          [ "$v" = "11.0" ] || { echo "::error::minos is $v, expected 11.0"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          # Create the release if this tag has none yet, otherwise reuse it.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Prebuilt binaries for $TAG"
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
